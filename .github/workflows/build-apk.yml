name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        working-directory: ./android-app
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen

      - name: Copy Web Assets
        run: |
          mkdir -p ./android-app/www
          cp -r ./magic_app/public/* ./android-app/www/
          echo "=== Files in www ==="
          ls -la ./android-app/www/ | head -20
          echo "=== File count ==="
          find ./android-app/www/ -type f | wc -l

      - name: Init Capacitor
        working-directory: ./android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch Android for microphone
        working-directory: ./android-app
        run: |
          chmod +x patch-android.sh
          bash patch-android.sh

      - name: Build Debug APK
        working-directory: ./android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geroy-skazki-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
