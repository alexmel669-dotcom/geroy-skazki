name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        working-directory: ./android-app
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen @capacitor/assets

      - name: Copy Web Assets
        run: |
          mkdir -p ./android-app/www
          cp -r ./magic_app/public/* ./android-app/www/
          echo "=== Files in www ==="
          ls -la ./android-app/www/ | head -20
          echo "=== File count ==="
          find ./android-app/www/ -type f | wc -l

      - name: Init Capacitor
        working-directory: ./android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Icons & Splash
        working-directory: ./android-app
        run: |
          echo "=== Resources ==="
          ls -la resources/
          echo "=== Generating icons and splash ==="
          npx capacitor-assets generate --android
          echo "=== Generated mipmap files ==="
          find android/app/src/main/res -name "ic_launcher*" -o -name "splash*" | head -30
          echo "=== Generated drawable files ==="
          ls -la android/app/src/main/res/drawable/ 2>/dev/null || echo "no drawable dir"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ 2>/dev/null || echo "no mipmap-xxxhdpi dir"

      - name: Patch Android for microphone
        working-directory: ./android-app
        run: |
          chmod +x patch-android.sh
          bash patch-android.sh

      - name: Build Debug APK
        working-directory: ./android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: geroy-skazki-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ./android-app/android/app/geroy-skazki.keystore
          ls -la ./android-app/android/app/geroy-skazki.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK (signed)
        working-directory: ./android-app/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/geroy-skazki.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: geroy-skazki-release-signed
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
