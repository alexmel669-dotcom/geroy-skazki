<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Регистрация — Герой Сказок</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" type="image/png" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-avatar"><img src="assets/images/avatar.svg" data-avatar="lucik" alt="Люцик" width="80" height="80"></div>
    <h1>Регистрация</h1>
    <p class="auth-subtitle">Создайте аккаунт и добавьте детей</p>
    
    <form id="registerForm">
      <input type="email" id="regEmail" placeholder="Ваш Email" required autocomplete="email">

      <div class="form-group promocode-group">
        <label for="parentName">👤 Ваше имя</label>
        <input type="text" id="parentName" placeholder="Анна" required autocomplete="name">
      </div>

      <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" required autocomplete="new-password" minlength="6">
      <input type="password" id="regPasswordConfirm" placeholder="Повторите пароль" required autocomplete="new-password" minlength="6">

      <div class="form-group promocode-group">
        <label for="promocode">🎁 Промокод (если есть)</label>
        <input type="text" id="promocode" placeholder="Например: TESTER2026" autocomplete="off">
        <small style="color:#ff9f4a;">🎁 Промокод для первых 100: <b>FOUNDERS</b> — Premium 30 дней</small>
        <span class="promocode-hint" id="promocodeHint"></span>
      </div>

      <div class="form-group promocode-group">
        <label for="parentPin">🔐 PIN для родительского кабинета (4 цифры)</label>
        <input type="password" id="parentPin" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" placeholder="1234" required autocomplete="off">
      </div>

      <div class="form-group promocode-group">
        <label for="secretQuestion">🔑 Секретный вопрос (для восстановления пароля)</label>
        <select id="secretQuestion" required>
          <option value="pet">Кличка вашего первого питомца?</option>
          <option value="city">Город, в котором вы родились?</option>
          <option value="mother">Девичья фамилия мамы?</option>
        </select>
        <input type="text" id="secretAnswer" placeholder="Ваш ответ" required autocomplete="off">
      </div>

      <!-- Ребёнок 1 (обязательно) -->
      <div class="child-block">
        <label>👶 Ребёнок 1 *</label>
        <input type="text" id="child1Name" placeholder="Имя ребёнка" required>
        <input type="date" id="child1Birthday" style="margin-top:8px;width:100%;" required>
        <select id="child1Gender" style="margin-top:8px;width:100%;">
          <option value="female">Девочка</option>
          <option value="male">Мальчик</option>
        </select>
      </div>
      
      <!-- Ребёнок 2 (опционально) -->
      <div class="child-block">
        <label>👶 Ребёнок 2 (необязательно)</label>
        <input type="text" id="child2Name" placeholder="Имя ребёнка">
        <input type="date" id="child2Birthday" style="margin-top:8px;width:100%;">
        <select id="child2Gender" style="margin-top:8px;width:100%;">
          <option value="female">Девочка</option>
          <option value="male">Мальчик</option>
        </select>
      </div>
      
      <!-- Ребёнок 3 (опционально) -->
      <div class="child-block">
        <label>👶 Ребёнок 3 (необязательно)</label>
        <input type="text" id="child3Name" placeholder="Имя ребёнка">
        <input type="date" id="child3Birthday" style="margin-top:8px;width:100%;">
        <select id="child3Gender" style="margin-top:8px;width:100%;">
          <option value="female">Девочка</option>
          <option value="male">Мальчик</option>
        </select>
      </div>
      
      <button type="submit" class="auth-btn">Зарегистрироваться</button>
    </form>
    
    <p class="auth-error" id="regError"></p>
    <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    <p class="auth-link" style="margin-top:12px;font-size:0.8rem;opacity:0.6;">
      <a href="privacy.html">Конфиденциальность</a> · <a href="terms.html">Соглашение</a>
    </p>
  </div>
</div>
<script type="module" src="./js/auth.js"></script>
<script type="module">
  import { initAvatarImages } from './js/config.js';
  initAvatarImages();
</script>
</body>
</html>
